server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;

    # Встроенный DNS Docker: после пересборки api nginx найдёт новый IP контейнера
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://api:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    location /api/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }

    # Заглушка до этапа с фронтендом
    location / {
        default_type text/plain;
        return 200 "pc-configurator: frontend is not deployed yet\n";
    }
}

# Публичный вход: сюда направлен туннель Tuna
server {
    listen 8090;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://api:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Админки на публичном адресе нет
    location ^~ /api/v1/admin {
        return 404;
    }

    location /api/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Фронтенд (React Router: неизвестные пути отдают index.html)
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
